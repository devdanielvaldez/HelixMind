schemaVersion: amcp/0.1
capability:
  id: biomedical.ontology-cross-mapping-review
  version: 0.1.0
  intent: Retrieve direct EBI OxO cross-reference candidates between exact disease ontology identifiers and retain them for human review without asserting term equivalence.
contract:
  inputs:
    type: object
    required: [session_id, task_id, source_identifier]
    properties:
      session_id: { type: string, minLength: 1 }
      task_id: { type: string, minLength: 1 }
      source_identifier: { type: string, pattern: '^(EFO_[0-9]{7,}|MONDO:[0-9]{7})$' }
      target_prefixes: { type: array, minItems: 1, maxItems: 10, items: { type: string, pattern: '^[A-Z][A-Z0-9_-]{0,31}$' } }
      distance: { type: integer, const: 1, default: 1 }
      limit: { type: integer, minimum: 1, maximum: 50, default: 20 }
  outputs:
    type: object
    required: [source_identifier, mappings, mapping_interpretation, artifact_id, human_review_required, research_only]
    properties:
      source_identifier: { type: string }
      mappings: { type: array, maxItems: 500, items: { type: object } }
      source_response_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      artifact_id: { type: string, minLength: 1 }
      human_review_required: { type: boolean, const: true }
      research_only: { type: boolean, const: true }
      mapping_interpretation: { type: string }
  successEvidence:
    - id: ontology-cross-reference-retained-for-review
      assertion: direct_oxo_mapping_candidates_are_retained_with_response_hash_and_never_asserted_as_ontology_equivalence
      acceptedTypes: [provider_receipt, state_assertion]
effects: [network_egress, data_write]
idempotency: not_guaranteed
recovery: reconcile
authority:
  permissions: [biomedical.ontology.mapping.read, biomedical.artifacts.write]
implementations:
  - id: medai-ontology-cross-mapping-review
    kind: mcp
    reference: mcp://medai/medai_ontology_cross_mapping_review
