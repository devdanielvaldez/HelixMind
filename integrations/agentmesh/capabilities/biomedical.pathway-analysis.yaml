schemaVersion: amcp/0.1
capability:
  id: biomedical.pathway-analysis
  version: 0.1.0
  intent: Analyze a bounded gene list for Reactome pathway over-representation with durable provenance.
contract:
  inputs:
    type: object
    required: [session_id, task_id, genes]
    properties:
      session_id: { type: string, minLength: 1 }
      task_id: { type: string, minLength: 1 }
      genes: { type: array, minItems: 1, maxItems: 5000, items: { type: string, minLength: 1, maxLength: 64 } }
      species: { type: string, enum: [Homo sapiens, Mus musculus, Rattus norvegicus], default: Homo sapiens }
      page_size: { type: integer, minimum: 1, maximum: 100, default: 20 }
  outputs:
    type: object
    required: [analysis, artifact_id]
    properties:
      analysis: { type: object }
      artifact_id: { type: string }
  successEvidence:
    - id: pathway-analysis-retained
      assertion: research_artifact.source_is_reactome_and_contains_input_hash_and_analysis_result
      acceptedTypes: [provider_receipt, state_assertion]
  effects: [external_communication, network_egress, data_write]
  idempotency: not_guaranteed
  recovery: reconcile
authority:
  permissions: [biomedical.pathways.analyze]
implementations:
  - id: medai-reactome-pathway-analysis
    kind: mcp
    reference: mcp://medai/medai_pathways_analyze_reactome
