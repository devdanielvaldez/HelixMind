schemaVersion: amcp/0.1
capability:
  id: biomedical.capability-generate-python-proposal
  version: 0.1.0
  intent: Use the configured structured model provider to draft, statically inspect, and installation-locally HMAC-sign a disabled Python capability proposal with source and model provenance; never execute, register, or promote generated code.
contract:
  inputs:
    type: object
    required: [session_id, task_id, capability_id, description, contract, implementation_requirements]
    properties:
      session_id: { type: string, minLength: 1 }
      task_id: { type: string, minLength: 1 }
      capability_id: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$' }
      description: { type: string, minLength: 1, maxLength: 2000 }
      contract: { type: object }
      implementation_requirements: { type: array, minItems: 1, maxItems: 50, items: { type: string, minLength: 1, maxLength: 2000 } }
  outputs:
    type: object
    required: [available, executed, registered, promoted]
    properties:
      available: { type: boolean }
      proposal: { type: object }
      artifact_id: { type: string, minLength: 1 }
      amcp_artifact_id: { type: string, minLength: 1 }
      amcp_package: { type: object }
      charged_credits: { type: integer, minimum: 0 }
      executed: { type: boolean, const: false }
      registered: { type: boolean, const: false }
      promoted: { type: boolean, const: false }
      reason: { type: string }
  successEvidence:
    - id: generated-disabled-code-artifact
      assertion: artifact_retains_model_prompt_response_and_source_hashes_static_policy_contract_disabled_lifecycle_and_verified_installation_signature
      acceptedTypes: [provider_receipt, state_assertion]
effects: [model_inference, data_write]
idempotency: not_guaranteed
recovery: reconcile
authority:
  permissions: [biomedical.capabilities.propose, biomedical.artifacts.write]
implementations:
  - id: medai-python-capability-code-generator
    kind: mcp
    reference: mcp://medai/medai_capabilities_generate_python_proposal
