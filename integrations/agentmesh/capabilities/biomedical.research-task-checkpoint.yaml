schemaVersion: amcp/0.1
capability:
  id: biomedical.research-task-checkpoint
  version: 0.1.0
  intent: Persist bounded, auditable worker progress tied to a live task lease for restartable execution.
contract:
  inputs:
    type: object
    required: [session_id, task_id, worker_id, checkpoint]
    properties:
      session_id: { type: string, minLength: 1 }
      task_id: { type: string, minLength: 1 }
      worker_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
      checkpoint: { type: object }
  outputs:
    type: object
    required: [session_id, task_id, saved]
    properties:
      session_id: { type: string }
      task_id: { type: string }
      saved: { type: boolean, enum: [true] }
  successEvidence:
    - id: worker-checkpoint-durable
      assertion: task_checkpoint_sha256_is_recorded_under_active_worker_lease
      acceptedTypes: [provider_receipt, state_assertion]
  effects: [data_write]
  idempotency: guaranteed
  recovery: retry
authority:
  permissions: [biomedical.research.tasks.checkpoint]
implementations:
  - id: medai-research-task-checkpoint
    kind: mcp
    reference: mcp://medai/medai_research_save_checkpoint
