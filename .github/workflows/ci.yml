name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-license-policy:
    name: Rust dependency license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check licenses
          arguments: --all-features

  science:
    name: Python science tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: science/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,mcp,bio,chemistry]"
        working-directory: science
      - run: python -m pip install pip-licenses==5.5.4
      - name: Enforce the Python runtime dependency license allowlist
        run: pip-licenses --format=json | python scripts/check_dependency_licenses.py
        working-directory: science
      - run: ruff check src tests
        working-directory: science
      - run: mypy src/medai_science
        working-directory: science
      - name: Provision immutable Python sandbox image for real container integration tests
        run: |
          docker pull python:3.12-slim
          image_ref=$(docker image inspect --format='{{index .RepoDigests 0}}' python:3.12-slim)
          printf '%s\n' "$image_ref" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'
          echo "MEDAI_PYTHON_SANDBOX_IMAGE=$image_ref" >> "$GITHUB_ENV"
      - name: Build immutable R sandbox image for real container integration tests
        run: |
          docker pull rocker/r-ver:4.4.3
          base_image=$(docker image inspect --format='{{index .RepoDigests 0}}' rocker/r-ver:4.4.3)
          printf '%s\n' "$base_image" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'
          docker build --build-arg "R_BASE_IMAGE=$base_image" -f science/sandbox/r/Dockerfile -t medai-r-sandbox .
          image_id=$(docker image inspect --format='{{.Id}}' medai-r-sandbox)
          printf '%s\n' "$image_id" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "MEDAI_R_SANDBOX_IMAGE=$image_id" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p medai-wasm-fixture --target wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "49.0.2"
          github_token: ${{ github.token }}
      - name: Build immutable Wasmtime sandbox image and provision real guest fixture
        run: |
          set -eu
          docker pull debian:bookworm-slim
          base_image=$(docker image inspect --format='{{index .RepoDigests 0}}' debian:bookworm-slim)
          printf '%s\n' "$base_image" | grep -Eq '^.+@sha256:[0-9a-f]{64}$'
          context=science/sandbox/wasm/.ci-context
          mkdir -p "$context"
          trap 'rm -rf "$context"' EXIT
          cp "$(command -v wasmtime)" "$context/wasmtime"
          docker build --build-arg "WASMTIME_BASE_IMAGE=$base_image" -f science/sandbox/wasm/Dockerfile -t medai-wasmtime-sandbox "$context"
          image_id=$(docker image inspect --format='{{.Id}}' medai-wasmtime-sandbox)
          printf '%s\n' "$image_id" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "MEDAI_WASM_SANDBOX_IMAGE=$image_id" >> "$GITHUB_ENV"
          echo "MEDAI_WASM_FIXTURE_MODULE=$GITHUB_WORKSPACE/target/wasm32-wasip1/release/medai-wasm-fixture.wasm" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
        working-directory: science

  deployment-config:
    name: Compose deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose service dependencies and healthcheck configuration
        run: docker compose config --format json > /tmp/medai-compose.json
        env:
          COMPOSE_PROFILES: agentmesh-worker,agentmesh-specialist,monitoring
          MEDAI_API_BEARER_TOKEN: ci-placeholder-api-secret-01234567890123456789
          MEDAI_MCP_BEARER_TOKEN: ci-placeholder-mcp-secret-01234567890123456789
          MEDAI_WEB_SESSION_SECRET: ci-placeholder-web-secret-01234567890123456789
      - name: Verify API, provider-egress, and metrics network separation
        run: node scripts/verify-compose-network-isolation.mjs /tmp/medai-compose.json
      - name: Validate Prometheus scrape and alert rules
        run: >-
          docker run --rm --entrypoint=/bin/promtool
          -v "$GITHUB_WORKSPACE/deploy:/etc/prometheus:ro"
          -v "$GITHUB_WORKSPACE/deploy/metrics-token.example:/run/secrets/medai_metrics_token:ro"
          prom/prometheus:v3.15.0
          check config /etc/prometheus/prometheus.yml
      - name: Validate MedAI alert rule expressions
        run: >-
          docker run --rm --entrypoint=/bin/promtool
          -v "$GITHUB_WORKSPACE/deploy:/etc/prometheus:ro"
          prom/prometheus:v3.15.0
          check rules /etc/prometheus/medai-rules.yml
      - name: Validate Alertmanager configuration in UTF-8 strict mode
        run: >-
          docker run --rm --entrypoint=/bin/amtool
          -v "$GITHUB_WORKSPACE/deploy:/etc/alertmanager:ro"
          -v "$GITHUB_WORKSPACE/deploy/alert-webhook-url.example:/run/secrets/medai_alert_webhook_url:ro"
          prom/alertmanager:v0.34.1
          check-config /etc/alertmanager/alertmanager.yml --enable-feature=utf8-strict-mode

  web:
    name: Web typecheck, build, and browser audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: node --test scripts/browser-session.test.mjs scripts/localization.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:a11y
        env:
          CI: "true"

  sbom:
    name: Source SPDX SBOM
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Generate and publish the source dependency SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: medai-source.spdx.json
          output-file: medai-source.spdx.json
          syft-version: v1.54.1
          upload-artifact: true
          upload-release-assets: false
