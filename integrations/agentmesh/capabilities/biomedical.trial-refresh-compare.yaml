schemaVersion: amcp/0.1
capability:
  id: biomedical.trial-refresh-compare
  version: 0.1.0
  intent: Retrieve a current ClinicalTrials.gov v2 study record, retain it in the research session, and compare source fields with the latest prior MedAI-captured record for that NCT ID.
contract:
  inputs:
    type: object
    required: [session_id, task_id, nct_id]
    properties:
      session_id: { type: string, minLength: 1 }
      task_id: { type: string, minLength: 1 }
      nct_id: { type: string, pattern: '^NCT[0-9]{8}$' }
  outputs:
    type: object
    required: [study, snapshot_artifact_id, comparison, history_scope, research_only]
    properties:
      study: { type: object }
      snapshot_artifact_id: { type: string, minLength: 1 }
      comparison: { type: [object, 'null'] }
      comparison_artifact_id: { type: [string, 'null'] }
      history_scope: { type: string }
      research_only: { type: boolean, const: true }
  successEvidence:
    - id: current-snapshot-retained-and-diffed
      assertion: current_record_snapshot_is_retained_and_any_comparison_uses_prior_same-session_snapshot_without_interpreting_changes
      acceptedTypes: [provider_receipt, state_assertion]
effects: [external_communication, network_egress, data_write]
idempotency: not_guaranteed
recovery: reconcile
authority:
  permissions: [biomedical.trials.read, biomedical.artifacts.write]
implementations:
  - id: medai-trial-refresh-compare
    kind: mcp
    reference: mcp://medai/medai_trials_refresh_and_compare
