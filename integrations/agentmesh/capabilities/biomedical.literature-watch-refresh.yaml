schemaVersion: amcp/0.1
capability:
  id: biomedical.literature-watch-refresh
  version: 0.2.0
  intent: Run a bounded PubMed EDAT query, retry a bounded queued metadata batch, and record discovery without validating claims.
contract:
  inputs:
    type: object
    required: [session_id, watch_id, query, interval_seconds, worker_id, pending_metadata_pmids]
    properties:
      session_id: {"type":"string","minLength":1}
      watch_id: {"type":"string","pattern":"^[a-f0-9]{64}$"}
      query: {"type":"string","minLength":1,"maxLength":1000}
      interval_seconds: {"type":"integer","minimum":86400,"maximum":31536000}
      worker_id: {"type":"string","minLength":1,"maxLength":128}
      last_pmids: {"type":["array","null"],"items":{"type":"string","pattern":"^[0-9]+$"},"maxItems":200}
      pending_metadata_pmids: {"type":"array","items":{"type":"string","pattern":"^[0-9]+$"},"maxItems":20}
  outputs:
    type: object
    required: [event, window_days, returned_pmids, new_pmids, new_pmid_identifiers, metadata_candidates, retained_record_count, metadata_pending_count, metadata_overflow_count, incomplete, research_only, evidence_validated]
    properties:
      event: { type: object }
      window_days: { type: integer }
      returned_pmids: { type: integer }
      new_pmids: { type: integer }
      new_pmid_identifiers: { type: array }
      retained_record_count: { type: integer, minimum: 0, maximum: 20 }
      metadata_candidates: { type: integer, minimum: 0, maximum: 20 }
      metadata_pending_count: { type: integer, minimum: 0, maximum: 10000 }
      metadata_overflow_count: { type: integer, minimum: 0, maximum: 400 }
      incomplete: { type: boolean }
      research_only: { type: boolean, const: true }
      evidence_validated: { type: boolean, const: false }
  successEvidence:
    - id: literature-watch-state
      assertion: session_scoped_pubmed_discovery_is_auditable_and_does_not_become_validated_evidence
      acceptedTypes: [state_assertion, provider_receipt]
  effects: [external_communication, network_egress, data_write]
  idempotency: not_guaranteed
  recovery: reconcile
authority:
  permissions: [biomedical.literature.read, biomedical.literature.watch.execute, biomedical.budget.consume]
implementations:
  - id: medai-literature-watch-refresh
    kind: mcp
    reference: mcp://medai/medai_literature_watch_refresh
