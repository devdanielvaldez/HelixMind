schemaVersion: amcp/0.1
capability:
  id: biomedical.protein-structure-alphafold
  version: 0.1.0
  intent: Retrieve AlphaFold DB predicted structure metadata and coordinate URLs for a UniProt protein accession.
contract:
  inputs:
    type: object
    required: [session_id, task_id, uniprot_accession]
    properties:
      session_id: { type: string, minLength: 1 }
      task_id: { type: string, minLength: 1 }
      uniprot_accession: { type: string, pattern: '^[A-Za-z0-9]{6,10}(-[1-9][0-9]*)?$' }
  outputs:
    type: object
    required: [accession, predictions, artifact_id, research_only]
    properties:
      accession: { type: string }
      predictions: { type: array, items: { type: object } }
      artifact_id: { type: string, minLength: 1 }
      research_only: { type: boolean, const: true }
  successEvidence:
    - id: alphafold-model-snapshot-retained
      assertion: artifact.source_is_alphafold_db_and_each_model_has_accession_and_snapshot_hash
      acceptedTypes: [provider_receipt, state_assertion]
  effects: [external_communication, network_egress, data_write]
  idempotency: not_guaranteed
  recovery: reconcile
authority:
  permissions: [biomedical.proteins.structure.read, biomedical.artifacts.write]
implementations:
  - id: medai-alphafold-structure-lookup
    kind: mcp
    reference: mcp://medai/medai_proteins_get_alphafold_structure
