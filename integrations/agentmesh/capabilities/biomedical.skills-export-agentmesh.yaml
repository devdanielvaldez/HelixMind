schemaVersion: amcp/0.1
capability:
  id: biomedical.skills-export-agentmesh
  version: 0.1.0
  intent: Export a verified disabled Skill candidate as an installable read-only AgentMesh AMCP review package.
contract:
  inputs:
    type: object
    required: [skill_id, version]
    properties:
      skill_id: {"type":"string","minLength":3,"maxLength":160}
      version: {"type":"string","pattern":"^[0-9]+\\.[0-9]+\\.[0-9]+\\+[a-f0-9]{16}$"}
  outputs:
    type: object
    required: [skill_id, version, package_yaml, package_sha256, signature_verified, execution_enabled, review_required, installation]
    properties:
      skill_id: { type: string }
      version: { type: string }
      package_yaml: { type: string }
      package_sha256: { type: string }
      signature_verified: { type: boolean , const: true }
      execution_enabled: { type: boolean , const: false }
      review_required: { type: boolean , const: true }
      installation: { type: string }
  successEvidence:
    - id: signed-skill-review-package
      assertion: installation_local_skill_signature_is_verified_and_execution_remains_disabled_pending_human_approval
      acceptedTypes: [state_assertion]
  effects: [read_only]
  idempotency: guaranteed
  recovery: retry
authority:
  permissions: [biomedical.skills.read]
implementations:
  - id: medai-skills-export-agentmesh
    kind: mcp
    reference: mcp://medai/medai_skills_export_agentmesh
