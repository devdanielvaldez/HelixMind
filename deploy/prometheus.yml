global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/medai-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: medai-api
    metrics_path: /v1/admin/metrics
    static_configs:
      - targets: ["api:8090"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/medai_metrics_token
