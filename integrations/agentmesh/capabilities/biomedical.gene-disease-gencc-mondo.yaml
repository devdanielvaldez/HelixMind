schemaVersion: amcp/0.1
capability:
  id: biomedical.gene-disease-gencc-mondo
  version: 0.1.0
  intent: Retrieve submission-level GenCC gene-disease assertions by exact MONDO disease identifier from a conditionally cached export.
contract:
  inputs:
    type: object
    required: [session_id, task_id, disease_curie]
    properties:
      session_id: { type: string, minLength: 1 }
      task_id: { type: string, minLength: 1 }
      disease_curie: { type: string, pattern: '^MONDO:[0-9]{7}$' }
      limit: { type: integer, minimum: 1, maximum: 100, default: 50 }
  outputs:
    type: object
    required: [source, data_license, query, dataset_sha256, assertions, total_matching_assertions, truncated, research_only]
    properties:
      source: { type: string, const: Gene Curation Coalition (GenCC) }
      data_license: { type: string, const: CC0-1.0 }
      query: { type: object }
      dataset_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
      assertions: { type: array, maxItems: 100, items: { type: object } }
      total_matching_assertions: { type: integer, minimum: 0 }
      truncated: { type: boolean }
      artifact_id: { type: string }
      research_only: { type: boolean, const: true }
      interpretation_limit: { type: string }
  successEvidence:
    - id: gencc-mondo-submissions-retained
      assertion: exact_mondo_disease_submission_assertions_are_retained_with_source_and_dataset_hashes
      acceptedTypes: [provider_receipt, state_assertion]
  effects: [external_communication, network_egress, data_write]
  idempotency: not_guaranteed
  recovery: reconcile
authority:
  permissions: [biomedical.genetics.gene_disease.read, biomedical.artifacts.write]
implementations:
  - id: medai-gencc-mondo-query
    kind: mcp
    reference: mcp://medai/medai_gene_disease_gencc_disease
