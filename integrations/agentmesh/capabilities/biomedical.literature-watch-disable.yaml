schemaVersion: amcp/0.1
capability:
  id: biomedical.literature-watch-disable
  version: 0.1.0
  intent: Disable a PubMed discovery schedule while retaining its event history.
contract:
  inputs:
    type: object
    required: [session_id, watch_id]
    properties:
      session_id: {"type":"string","minLength":1}
      watch_id: {"type":"string","pattern":"^[a-f0-9]{64}$"}
  outputs:
    type: object
    required: [disabled]
    properties:
      disabled: { type: boolean }
  successEvidence:
    - id: literature-watch-state
      assertion: session_scoped_pubmed_discovery_is_auditable_and_does_not_become_validated_evidence
      acceptedTypes: [state_assertion, provider_receipt]
  effects: [data_write]
  idempotency: not_guaranteed
  recovery: reconcile
authority:
  permissions: [biomedical.literature.watch.write]
implementations:
  - id: medai-literature-watch-disable
    kind: mcp
    reference: mcp://medai/medai_literature_watch_disable
